<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111813" />
    <link rel="icon" type="image/svg+xml" href="/brand/zentra-favicon.svg?v=2" />
    <meta name="description" content="Zentra helps teams write, manage, and understand their policies." />
    <title>Zentra</title>
    <script>
      try {
        const theme = localStorage.getItem('zentra-theme') || localStorage.getItem('policydesk-theme') || 'dark';
        if (theme === 'light' || theme === 'dark') localStorage.setItem('zentra-theme', theme);
        document.documentElement.classList.toggle('dark', theme === 'dark');
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
