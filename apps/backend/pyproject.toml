[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "policydesk-api"
version = "0.1.0"
description = "Policy Desk application API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "supabase>=2.10,<3.0",
    "httpx>=0.27,<1.0",
    "email-validator>=2.2,<3.0",
    "cryptography>=44,<47",
]

[dependency-groups]
dev = [
    "ruff>=0.8,<1.0",
    "ty>=0.0.1a0",
]

[tool.fastapi]
entrypoint = "policydesk_api.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/policydesk_api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
